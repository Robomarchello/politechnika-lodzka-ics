name: Update calendar.ics

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - generate_ics.py
      - .github/workflows/update-calendar.yml

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate calendar.ics
        run: python generate_ics.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- calendar.ics && [ -n "$(git ls-files calendar.ics)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "Update calendar.ics"
          git push